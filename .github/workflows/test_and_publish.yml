name: Test and Publish Packages

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    - name: Check TypeScript compilation
      run: npx tsc --noEmit

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v4

    # the parity tests compare the Python package with the npm build
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'

    - name: Build the npm package
      run: |
        npm ci
        npm run build

    - name: Use Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install
      run: pip install "./python[stealth]" pytest

    - name: Run tests
      working-directory: python
      run: pytest -q

  web:
    name: Website
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        cache-dependency-path: web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build
      run: npm run build

  publish:
    name: Build and Publish to NPM
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    
    # Trusted publishing needs npm 11.5.1 or newer
    - name: Update npm
      run: npm install -g npm@latest
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Run tests
      run: npm test
    
    # tag pushes for a version that is already on npm (e.g. moving an old tag) have nothing to publish
    - name: Check whether this version is already published
      id: published
      run: |
        version=$(node -p "require('./package.json').version")
        if npm view "sd-parsers@$version" version >/dev/null 2>&1; then
          echo "sd-parsers@$version is already on npm, skipping publish"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    # Authenticates through OIDC and adds provenance automatically, no token needed
    - name: Publish to NPM
      if: steps.published.outputs.skip != 'true'
      run: npm publish --access public

  publish-pypi:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, python]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch')
    environment:
      name: pypi
      url: https://pypi.org/project/sd-parse/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v4

    - name: Use Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Check whether this version is already published
      id: published
      run: |
        version=$(python -c "import json; print(json.load(open('package.json'))['version'])")
        if curl -sf "https://pypi.org/pypi/sd-parse/$version/json" >/dev/null; then
          echo "sd-parse $version is already on PyPI, skipping publish"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Build
      if: steps.published.outputs.skip != 'true'
      run: |
        pip install build
        python -m build python

    - name: Publish to PyPI
      if: steps.published.outputs.skip != 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: python/dist
